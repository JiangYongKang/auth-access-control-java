# ================= 认证与访问控制（本地运行配置） =================
# HMAC-SHA256 签名密钥：只以 Base64 形式存放（非明文），生产请用环境变量覆盖：
#   AUTH_TOKEN_KEY_BASE64=<base64 of 32+ bytes>
# 默认值仅供本地开发，使用后请务必更换。
auth.token.key-base64=${AUTH_TOKEN_KEY_BASE64:muYhUjc7XlKU9i14RFAohKYM0/fBtMS9hbL4G9Sj+Rc=}
auth.token.issuer=local-auth
auth.token.audience=local-api
auth.token.ttl=30m
auth.refresh.ttl=7d
# 并发使用同一刷新令牌时的判定宽限窗口（窗口内记 CONCURRENT_REUSE，窗口后记 REPLAYED）
auth.refresh.grace-window=100ms
auth.refresh.store-path=${AUTH_TOKEN_STORE_PATH:data/token-state.json}

# 限流：同一主体(sub@cid)在每个时间窗口内的最大请求数
auth.rate-limit.window-requests=100
auth.rate-limit.window=1m

# ---------------- 本地用户（口令仅 PBKDF2 哈希，明文口令不落盘） ----------------
# 明文口令不写在此文件；本地开发口令见 README.md
auth.users[0].username=alice
auth.users[0].password-hash=pbkdf2$120000$PSMT7ODTA25bHotvngbBQw==$hDdwxfLZr6ADgNqVZ3g/SQhC6jHBLh5QiUzvvNbKwmY=
auth.users[0].roles=ADMIN,USER
auth.users[1].username=bob
auth.users[1].password-hash=pbkdf2$120000$hLywtlTsagx59yH0pXJ9XQ==$D57d7wqEIPAC4hGShyAWvJ4lCS5XnSto9xSA8/qeNZE=
auth.users[1].roles=USER

# ---------------- 本地客户端（密钥仅 PBKDF2 哈希） ----------------
# 客户端明文密钥不写在此文件；本地开发凭据见 README.md
auth.clients[0].client-id=webapp
auth.clients[0].secret-hash=pbkdf2$120000$KGf3Z58yhz23tghQEPyT1w==$WtIyDkF3FX8L7ktTEH8J8f0OaPgxAtbmzoPUuruY8gw=
auth.clients[0].scopes=profile:read,admin:read,doc:read
auth.clients[1].client-id=reader
auth.clients[1].secret-hash=pbkdf2$120000$ppf0Utb2NW9uSNJnRQQCbQ==$UgVkNleqnyAOFAfzD8FfCAMJfVPceR9gKuWzUW57Pw0=
auth.clients[1].scopes=profile:read,doc:read

# ---------------- 资源归属表（用于资源归属判定） ----------------
auth.documents.doc-alice-1=alice
auth.documents.doc-bob-1=bob

# Spring Boot
spring.main.banner-mode=off
logging.level.com.github.highcumontoa=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
