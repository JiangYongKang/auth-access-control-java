# ===== 认证与访问控制配置（本地运行，全部状态保存在本机/内存）=====

# 签名密钥有两种配置方式（二者互斥，不能同时设置）：
#
# 方式一（推荐，支持平滑轮换）：多把命名密钥 + 指定当前签发密钥。
#   auth.security.keys.<kid>=<secret>      —— 配置若干把密钥，kid 为自定义标识
#   auth.security.active-key-id=<kid>      —— 当前用来签发新令牌的那一把
#   新令牌头部带 kid；验签按 kid 在配置中定位密钥。
#   轮换做法：先把新密钥加进 keys 并把 active-key-id 指向它（旧密钥保留，旧令牌继续可用），
#             待旧令牌自然到期后，再把旧 kid 从 keys 摘掉（摘掉瞬间，其令牌即 unknown_signing_key）。
#   生产请用环境变量注入，例如（键名含点号时用 SPRING_... 绑定较繁琐，建议用下方 properties 形式
#   或 --auth.security.keys.k1=... 启动参数；Spring 宽松绑定同样支持环境变量）。
#
# 方式二（兼容，单密钥）：auth.security.hmac-key
#   仅配置一把密钥；签发的令牌头部不带 kid。保留它是为了兼容既有部署。
#
# 安全要求：密钥只能来自配置/环境变量注入，程序不会把任何密钥写入文件。
# 两种方式都未配置时，会在进程内存中生成一次性随机密钥（重启后旧令牌全部失效，仅适合临时调试）。
auth.security.hmac-key=${AUTH_HMAC_KEY:local-development-only-hmac-key-please-change}
auth.security.issuer=local-auth-service

# 访问令牌有效期 10 分钟；刷新令牌族有效期 14 天。
auth.token.access-ttl-seconds=600
auth.token.refresh-ttl-seconds=1209600
# 刷新令牌族状态文件（只保存令牌 SHA-256 哈希与撤销标记，无明文）。
auth.token.state-file=data/refresh-state.json

# 限流：同一主体每个 60 秒窗口最多 10 个通过认证的 /api 请求。
auth.ratelimit.max-requests=10
auth.ratelimit.window-seconds=60

# 本地服务端口
server.port=8080
