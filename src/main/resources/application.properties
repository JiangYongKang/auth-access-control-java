# ===== 认证与访问控制配置（本地运行，全部状态保存在本机/内存）=====

# 访问令牌 HMAC 签名密钥（两种配置方式，密钥只来自配置、只存在于内存，程序绝不写盘）：
#
# 方式一：多密钥平滑轮换（推荐）。
#   auth.security.signing-keys.<keyId>=<secret>  可配置多把；
#   auth.security.active-key-id=<keyId>          指定其中一把为"当前签发密钥"。
#   新签发的令牌带 kid=当前密钥；校验时按令牌 kid 选择对应保留密钥。
#   轮换：把新密钥加入 signing-keys 并把 active-key-id 指过去，先不要删旧密钥，
#         待线上旧令牌自然到期后再摘掉旧密钥；旧密钥一摘掉，由它签发的令牌立刻失效
#         （错误码 unknown_signing_key，区别于签名本身对不上的 bad_signature）。
#   例：
#     auth.security.signing-keys.k2026-09=${AUTH_HMAC_KEY_K2026_09:请替换为新随机串}
#     auth.security.signing-keys.k2026-03=${AUTH_HMAC_KEY_K2026_03:请替换为旧随机串}
#     auth.security.active-key-id=k2026-09
#
# 方式二：单密钥兼容（等同上一版本）。
auth.security.hmac-key=${AUTH_HMAC_KEY:local-development-only-hmac-key-please-change}
auth.security.issuer=local-auth-service
# 多密钥模式下请显式设置（见上方示例）；单密钥模式留空即可。
auth.security.active-key-id=${AUTH_ACTIVE_KEY_ID:}

# 访问令牌有效期 10 分钟；刷新令牌族有效期 14 天。
auth.token.access-ttl-seconds=600
auth.token.refresh-ttl-seconds=1209600
# 刷新令牌族状态文件（只保存令牌 SHA-256 哈希与撤销标记，无明文）。
auth.token.state-file=data/refresh-state.json

# 限流：同一主体每个 60 秒窗口最多 10 个通过认证的 /api 请求。
auth.ratelimit.max-requests=10
auth.ratelimit.window-seconds=60

# 本地服务端口
server.port=8080
